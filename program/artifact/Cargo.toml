[package]
name = "uptimesure-program-artifact"
version = "0.1.0"
edition = "2021"
description = "Deployable PolkaVM artifact for UptimeSure"
license = "MIT"
publish = false

[build-dependencies]
rialo-build-lib = { version = "0.10.1" }
rialo-venus-build-helper = { version = "0.10.1" }

[lints.rust]
future_incompatible = "warn"
nonstandard_style = "warn"
rust_2018_idioms = "warn"
unsafe_code = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
  'cfg(target_feature, values("static-syscalls"))',
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("frozen-abi", "no-entrypoint", "custom-panic", "custom-heap"))',
  'cfg(msim)',
  'cfg(fail_points)',
  'cfg(rialo_simtest_seed_sweep)',
  'cfg(bazel)',
]
