name: rialo-devnet-proof

on:
  push:
    branches: [main]
    paths:
      - "program/**"
      - "scripts/devnet-smoke.sh"
      - ".github/workflows/devnet-proof.yml"
  pull_request:
    paths:
      - "program/**"
      - "scripts/devnet-smoke.sh"
      - ".github/workflows/devnet-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RIALO_HOME: ${{ github.workspace }}/.rialo
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rialoman non-interactively
        shell: bash
        run: |
          set -euxo pipefail
          cargo install rialoman --version 0.3.0 --locked
          rialoman --version

      - name: Install pinned Rialo toolchain
        shell: bash
        run: |
          set -euxo pipefail
          rustup target add wasm32-wasip2
          rialoman install stable@0.10.1
          rialoman use stable@0.10.1
          rialoman current
          RIALO_BIN="$(dirname "$(rialoman which rialo)")"
          echo "$RIALO_BIN" >> "$GITHUB_PATH"
          export PATH="$RIALO_BIN:$PATH"
          rialo --version

      - name: Stock-Rust type check
        run: cargo check --manifest-path program/Cargo.toml

      - name: Build deployable PolkaVM and REX component
        run: cargo build --manifest-path program/artifact/Cargo.toml

      - name: Verify generated Venus interface
        shell: bash
        run: |
          set -euxo pipefail
          find program/wit -maxdepth 1 -type f -print
          test -f program/wit/uptimesure-program-manifest.json

      - name: Configure Rialo DevNet
        shell: bash
        run: |
          set -euxo pipefail
          rialo config network switch devnet

      - name: Generate fresh unlocked DevNet-only keypair
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof
          # Rialo 0.10.1 takes the account alias positionally. Empty
          # keystore/key passwords keep this disposable DevNet account
          # usable non-interactively without putting a password in CI.
          printf '\n\n' | rialo keytool generate uptimesure-ci 2>&1 | tee proof/keygen.log
          printf '\n\n' | rialo keytool generate uptimesure-rex-ci 2>&1 | tee -a proof/keygen.log
          DEPLOYER_PUBKEY="$(sed -n 's/.*public key: \([^,]*\).*/\1/p' proof/keygen.log | head -n 1)"
          test -n "$DEPLOYER_PUBKEY"
          echo "DEPLOYER_PUBKEY=$DEPLOYER_PUBKEY" >> "$GITHUB_ENV"

      - name: Fund DevNet deployer
        shell: bash
        run: |
          set -euxo pipefail
          for _ in 1 2 3 4 5; do
            rialo client airdrop --amount 1
          done

      - name: Inspect supported Venus deploy command
        shell: bash
        run: |
          set -euxo pipefail
          rialo client program deploy-venus --help

      - name: Deploy UptimeSure to Rialo DevNet
        working-directory: program
        shell: bash
        run: |
          set +e
          set -uo pipefail
          status=1
          for attempt in 1 2 3; do
            echo "deployment_attempt=$attempt" | tee -a ../devnet-deploy.log
            rialo client program deploy-venus . \
              --keypair "$HOME/.config/rialo/uptimesure-ci.keypair" \
              --rex-keypair "$HOME/.config/rialo/uptimesure-rex-ci.keypair" \
              2>&1 | tee -a ../devnet-deploy.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Rialo deployment attempt $attempt failed; retrying the same deterministic IDs in 15s" | tee -a ../devnet-deploy.log
              sleep 15
            fi
          done
          exit "$status"

      - name: Create real healthy guarantee and run an HTTP check
        if: success()
        working-directory: program
        shell: bash
        env:
          DEPLOY_LOG: ../devnet-deploy.log
        run: |
          set -euo pipefail
          PROGRAM_ID="$(sed -n 's/^Venus program deployed at //p' "$DEPLOY_LOG" | tail -n 1)"
          REX_ACCOUNT="$(sed -n 's/^REX components deployed at //p' "$DEPLOY_LOG" | tail -n 1)"
          test -n "$PROGRAM_ID"
          test -n "$REX_ACCOUNT"
          SLUG="$(openssl rand -hex 32)"
          echo "workflow_slug=$SLUG" | tee ../proof/guarantee-inputs.txt
          rialo client program invoke "$PROGRAM_ID" --program-dir . \
            --function create_guarantee \
            --arg workflow_pda_slug="$SLUG" \
            --arg service_name="UptimeSure public healthy proof" \
            --arg endpoint_url="https://example.com" \
            --arg expected_fragment="Example Domain" \
            --arg beneficiary="$DEPLOYER_PUBKEY" \
            --arg check_interval_secs=30 \
            --arg failure_threshold=2 \
            --arg compensation_kelvin=0 \
            --arg max_payouts=1 \
            --arg __rex_bytecode_account="$REX_ACCOUNT" \
            --json 2>&1 | tee ../proof/create-guarantee.log
          rialo client program invoke "$PROGRAM_ID" --program-dir . \
            --function run_check_now \
            --arg workflow_pda_slug="$SLUG" \
            --json 2>&1 | tee ../proof/run-check-now.log
          TX_SIGNATURE="$(grep -Eo '[1-9A-HJ-NP-Za-km-z]{80,100}' ../proof/create-guarantee.log | head -n 1)"
          CHECK_SIGNATURE="$(grep -Eo '[1-9A-HJ-NP-Za-km-z]{80,100}' ../proof/run-check-now.log | head -n 1)"
          test -n "$TX_SIGNATURE"
          test -n "$CHECK_SIGNATURE"
          rialo client get-workflow-lineage "$TX_SIGNATURE" --full-id true 2>&1 | tee ../proof/create-guarantee-lineage.log
          rialo client get-workflow-lineage "$CHECK_SIGNATURE" --full-id true 2>&1 | tee ../proof/run-check-lineage.log
          {
            echo "program_id=$PROGRAM_ID"
            echo "rex_bytecode_account=$REX_ACCOUNT"
            echo "create_guarantee_signature=$TX_SIGNATURE"
            echo "run_check_now_signature=$CHECK_SIGNATURE"
            echo "endpoint=https://example.com"
            echo "expected_fragment=Example Domain"
          } > ../proof/guarantee-proof.env

      - name: Collect proof artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p proof
          cp -f devnet-deploy.log proof/ 2>/dev/null || true
          cp -f program/wit/*.json proof/ 2>/dev/null || true
          cp -f program/wit/*.wit proof/ 2>/dev/null || true
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "rialo_version=$(rialo --version 2>/dev/null || true)"
            echo "rialoman=$(rialoman current 2>/dev/null || true)"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > proof/build-meta.txt

      - name: Upload DevNet proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uptimesure-devnet-proof
          path: proof
          if-no-files-found: warn
          retention-days: 30
