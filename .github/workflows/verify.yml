name: rialo-experimental-verify

# The Rialo prototype is retained for future migration work, but it is no
# longer a release gate for the Base Sepolia/Supabase product. Run this
# manually when working on the experimental adapter.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve prototype without gating V1
        run: |
          test -f program/Cargo.toml
          test -f web/package.json
          echo "Rialo prototype retained under program/ and web/."
          echo "See docs/RIALO_MIGRATION.md for the proven and unresolved runtime evidence."
