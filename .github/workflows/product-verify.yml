name: product-verify

on:
  push:
    branches: [main, product-v1]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "contracts/**"
      - "supabase/**"
      - "package.json"
      - "tsconfig.json"
      - "next.config.ts"
      - ".github/workflows/product-verify.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "contracts/**"
      - "supabase/**"
      - "package.json"
      - "tsconfig.json"
      - "next.config.ts"
      - ".github/workflows/product-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run compile
      - run: npm test

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check monitor
        run: deno check --config supabase/functions/monitor-due/deno.json supabase/functions/monitor-due/index.ts
      - name: Type-check chain sync
        run: deno check --config supabase/functions/sync-chain/deno.json supabase/functions/sync-chain/index.ts
